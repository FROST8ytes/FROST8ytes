<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img">
<title>FROST8ytes contribution streak</title>
<style>
text{font-family:ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;text-anchor:middle}
.n{font-size:30px;font-weight:700;fill:#ebdbb2}
.l{font-size:14px;fill:#fabd2f}
.d{font-size:12px;fill:#a89984}
.f{opacity:0;animation:in .6s ease-out forwards}
