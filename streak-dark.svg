</style>
<line x1="240" y1="35" x2="240" y2="155" stroke="#504945"/>
<line x1="480" y1="35" x2="480" y2="155" stroke="#504945"/>
<g class="f"><text class="n" x="120" y="88">691</text>
<text class="l" x="120" y="122">Total Contributions</text>
<text class="d" x="120" y="146">Dec 22, 2016 - Present</text></g>
<g class="f" style="animation-delay:.3s">
<circle cx="360" cy="78" r="40" fill="none" stroke="#fabd2f" stroke-width="5"/>
<path d="M360 26c4 6 9 9 9 16a9 9 0 0 1-18 0c0-4 3-6 4-9 1 3 3 4 5 4-1-4-1-7 0-11z" fill="#fe8019"/>
<text class="n" x="360" y="89">0</text>
<text class="l" x="360" y="146" style="font-weight:700">Current Streak</text>
<text class="d" x="360" y="166">No active streak</text></g>
<g class="f" style="animation-delay:.6s"><text class="n" x="600" y="88">7</text>
<text class="l" x="600" y="122">Longest Streak</text>
<text class="d" x="600" y="146">Mar 19 - Mar 25, 2022</text></g>
